name: CI

on:
  push:
  pull_request:

# One active run per ref; new pushes cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: gighound
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gighound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gighound -d gighound"
          --health-interval 5s --health-timeout 3s --health-retries 12
      # Valkey: BSD-licensed drop-in fork of Redis 7 (ships redis-cli compat).
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Runtime deps install from the hashed lock so CI == Docker.
      # Regenerate locks after editing requirements.txt:
      #   uv pip compile backend/requirements.txt --generate-hashes --python-version 3.12 -o backend/requirements.lock
      #   uv pip compile worker/requirements.txt --generate-hashes --python-version 3.12 -o worker/requirements.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-dev.txt
      - name: Run tests (SQLite)
        working-directory: backend
        run: python -m pytest -q
      # Second pass against real services: endpoint tests still override the
      # DB dependency with SQLite, but app-level code (config, SessionLocal
      # users, Redis-backed cache/rate paths) now runs against Postgres +
      # Redis instead of the graceful-degradation fallbacks.
      - name: Run tests (Postgres + Redis services)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://gighound:postgres@localhost:5432/gighound
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q
      # Catches broken/unapplied migrations against real Postgres (the test
      # suite itself runs on SQLite). Uses a dedicated throwaway database so
      # tables the Postgres test pass may have created can't interfere.
      # After `upgrade head`, the single head must equal the current revision.
      - name: Alembic migration smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://gighound:postgres@localhost:5432/alembic_smoke
        run: |
          python -c "import psycopg2; c=psycopg2.connect('postgresql://gighound:postgres@localhost:5432/gighound'); c.autocommit=True; c.cursor().execute('CREATE DATABASE alembic_smoke')"
          alembic upgrade head
          test "$(alembic heads | awk '{print $1}')" = "$(alembic current | awk '{print $1}')"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r worker/requirements.lock
          pip install -r worker/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q worker/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Hard gate on known vulnerabilities in production dependencies.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b
      - name: Build
        working-directory: frontend
        run: npx vite build

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # Fails the build on known vulnerabilities (hard gate, no ignores).
      - name: Audit backend runtime dependencies
        run: pip-audit -r backend/requirements.txt
      # The worker is internet-facing automation code; audit it too.
      - name: Audit worker runtime dependencies
        run: pip-audit -r worker/requirements.txt

  # Build-only check that all three images still compile (no push). The
  # backend image's stage 1 also covers the frontend bundle build.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend image (includes frontend build stage)
        run: docker build -f backend/Dockerfile .
      - name: Build worker image
        run: docker build ./worker
      - name: Build standalone frontend image
        run: docker build ./frontend
