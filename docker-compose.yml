x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://gighound:${POSTGRES_PASSWORD}@db:5432/gighound
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gighound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gighound
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gighound -d gighound"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot schema migration: backend/celery services wait for this to
  # finish, so celery tasks never run against a pre-migration schema on a
  # fresh deploy. (The backend image CMD also migrates — idempotent.)
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # All-in-one app container: builds the frontend bundle (stage 1 of
  # backend/Dockerfile) and serves it via FastAPI StaticFiles alongside the
  # API. Ollama URL defaults to http://ollama:11434/v1 inside containers
  # (auto-detected); set OLLAMA_BASE_URL in .env to use an external Ollama.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      # curl isn't in python:slim; probe the API health route with urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped
    # the image-level HEALTHCHECK probes the API; celery serves no HTTP
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: celery -A app.tasks beat --loglevel=info --schedule /home/gighound/celerybeat-schedule
    restart: unless-stopped
    # Persist the beat schedule DB (last-run state) across container recreates
    # so digest/discovery jobs don't re-fire. /home/gighound is created by
    # useradd in the image, so the named volume inherits gighound ownership.
    volumes:
      - celerybeat-data:/home/gighound
    # the image-level HEALTHCHECK probes the API; celery serves no HTTP
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional split-tier web tier: nginx serves the SPA and proxies /api/ +
  # /ws/ to the backend (see frontend/nginx.conf). The default all-in-one
  # path (the backend serves the SPA itself) is unchanged. Opt-in:
  #   docker compose --profile split-frontend up -d
  # then browse http://localhost:8080.
  frontend:
    build:
      context: ./frontend
    profiles: ["split-frontend"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  # Optional local LLM for proposal drafting. Opt-in:
  #   docker compose --profile llm up -d
  # then pull a model:  docker compose exec ollama ollama pull qwen3:4b
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
  celerybeat-data:
