x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://gighound:${POSTGRES_PASSWORD}@db:5432/gighound
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gighound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gighound
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gighound -d gighound"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # All-in-one app container: builds the frontend bundle (stage 1 of
  # backend/Dockerfile) and serves it via FastAPI StaticFiles alongside the
  # API. Ollama URL defaults to http://ollama:11434/v1 inside containers
  # (auto-detected); set OLLAMA_BASE_URL in .env to use an external Ollama.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment: *backend-env
    command: celery -A app.tasks beat --loglevel=info
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional local LLM for proposal drafting. Opt-in:
  #   docker compose --profile llm up -d
  # then pull a model:  docker compose exec ollama ollama pull qwen3:4b
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
