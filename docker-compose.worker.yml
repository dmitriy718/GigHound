# Stealth-browser worker override (AD-4). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up worker
# The base compose file provides the `backend` service; if you run the backend
# outside Docker instead, point GIGHOUND_API_URL at it.
services:
  worker:
    build: ./worker
    # No root env_file: this container runs a browser against hostile web
    # content and must not see DB credentials / LLM keys. Pass ONLY the
    # variables worker/config.py actually reads; values still come from the
    # root .env (or shell) at compose time via ${VAR} interpolation, and the
    # defaults below mirror config.py so unset vars behave as before.
    environment:
      GIGHOUND_API_URL: ${GIGHOUND_API_URL:-http://backend:8000}
      GIGHOUND_WORKER_TOKEN: ${GIGHOUND_WORKER_TOKEN:?set GIGHOUND_WORKER_TOKEN}
      WORKER_SESSION_DIR: /app/.sessions
      WORKER_PLATFORMS: ${WORKER_PLATFORMS:-}
      WORKER_HEADLESS: ${WORKER_HEADLESS:-true}
      WORKER_ALLOW_SUBMIT: ${WORKER_ALLOW_SUBMIT:-false}
      WORKER_POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL_SEC:-45}
      WORKER_POLL_JITTER_SEC: ${WORKER_POLL_JITTER_SEC:-15}
      WORKER_CONTEXT_IDLE_SEC: ${WORKER_CONTEXT_IDLE_SEC:-1800}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-America/New_York}
      WORKER_LOCALE: ${WORKER_LOCALE:-en-US}
      WORKER_PROXY_FIVERR: ${WORKER_PROXY_FIVERR:-}
      WORKER_PROXY_UPWORK: ${WORKER_PROXY_UPWORK:-}
      WORKER_PROXY_PEOPLEPERHOUR: ${WORKER_PROXY_PEOPLEPERHOUR:-}
      WORKER_PROXY_GURU: ${WORKER_PROXY_GURU:-}
    volumes:
      # persistent per-(platform, user) browser sessions
      - worker_sessions:/app/.sessions
    restart: unless-stopped
    shm_size: '1gb'  # Chromium crashes with Docker's default 64MB /dev/shm
    depends_on: [backend]
    healthcheck:
      # no pgrep in python:slim — scan /proc for the `python -m worker` process
      # (needle built at runtime so the healthcheck itself never self-matches)
      test: ["CMD", "python", "-c", "import os,sys; n=b'-m\\x00worker'; sys.exit(0 if any(n in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  worker_sessions:
